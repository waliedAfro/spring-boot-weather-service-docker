# Builds and tests on every push/PR; publishes to GitHub Packages only on release.
# Docs: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Afro Weather Service CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Publish to GitHub Packages
        if: github.event_name == 'release'
        run: mvn --batch-mode --no-transfer-progress deploy -DskipTests -s $GITHUB_WORKSPACE/settings.xml
